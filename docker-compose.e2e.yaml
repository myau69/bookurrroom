services:
  db_e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_e2e
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_e2e"]
      interval: 5s
      timeout: 3s
      retries: 10
